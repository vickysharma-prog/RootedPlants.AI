<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', system-ui, sans-serif; }
    a { color: #14543A; } a:hover { color: #0D3927; }

  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F6F3EC; color: #1A1C19; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 268px; position: relative; background: linear-gradient(168deg, #C9DEC2 0%, #A8C79E 60%, #8FA97F 100%); flex-shrink: 0; display: flex; align-items: flex-end; justify-content: center; overflow: hidden;">
    <svg width="230" height="230" viewBox="0 0 230 230" fill="none">
      <path d="M115 196V96" stroke="#41663A" stroke-width="7" stroke-linecap="round"/>
      <path d="M115 120c-36-9-56-32-56-60 30 0 56 18 56 60z" fill="#4E7A46"/>
      <path d="M115 146c35-13 51-36 51-62-30 0-51 22-51 62z" fill="#3D5F37"/>
      <path d="M115 172c-30-8-46-26-46-49 25 0 46 15 46 49z" fill="#5A8A50"/>

    </div>
    <div style="position: absolute; top: 52px; right: 18px; width: 40px; height: 40px; border-radius: 12px; background: rgba(255,253,248,0.85); display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1C19" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V3M8 7l4-4 4 4"/></svg>
    </div>
  </div>

  <div style="padding: 18px 20px 0;">
    <div class="disp" style="font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1;">Neem</div>
    <div style="font-size: 13px; color: #6B6F68; margin-top: 3px;">Azadirachta indica &middot; planted 14 June 2026 &middot; backyard</div>
  </div>

  <div style="display: flex; gap: 10px; padding: 16px 16px 0;">
    <div style="flex-grow: 1; background: #FFFDF8; border: 1px solid #E6E0D3; border-radius: 16px; padding: 12px 13px;">
      <div class="disp" style="font-size: 24px; font-weight: 800; letter-spacing: -0.02em;">94</div>
      <div style="font-size: 11.5px; color: #6B6F68; margin-top: 2px;">days alive</div>
    </div>
    <div style="flex-grow: 1; background: #FFFDF8; border: 1px solid #E6E0D3; border-radius: 16px; padding: 12px 13px;">
      <div class="disp" style="font-size: 24px; font-weight: 800; letter-spacing: -0.02em;">13</div>
      <div style="font-size: 11.5px; color: #6B6F68; margin-top: 2px;">day streak</div>
    </div>
    <div style="flex-grow: 1; background: #FFFDF8; border: 1px solid #E6E0D3; border-radius: 16px; padding: 12px 13px;">
      <div class="disp" style="font-size: 24px; font-weight: 800; letter-spacing: -0.02em; color: #14543A;">820</div>
      <div style="font-size: 11.5px; color: #6B6F68; margin-top: 2px;">points earned</div>
    </div>
  </div>

  <div style="padding: 22px 20px 10px; display: flex; align-items: baseline; justify-content: space-between;">
    <div class="disp" style="font-size: 17px; font-weight: 700;">How it has grown</div>
    <div style="font-size: 12px; color: #6B6F68;">24 photos</div>
  </div>

  <div style="display: flex; gap: 10px; padding: 0 16px; align-items: flex-end;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; align-items: center;">
      <div style="width: 100%; height: 76px; border-radius: 13px; background: linear-gradient(165deg, #DDE9D6, #BCD1B2); display: flex; align-items: flex-end; justify-content: center; overflow: hidden;">
        <svg width="42" height="42" viewBox="0 0 64 64" fill="none"><path d="M32 50V40" stroke="#4E7A46" stroke-width="3" stroke-linecap="round"/><circle cx="29" cy="38" r="4" fill="#6BA05C"/><circle cx="36" cy="37" r="3.4" fill="#57894B"/><path d="M24 50h16l-2 10H26z" fill="#8A6A48"/></svg>
      </div>
      <div style="font-size: 10.5px; color: #8C9088;">Jun</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; align-items: center;">
      <div style="width: 100%; height: 96px; border-radius: 13px; background: linear-gradient(165deg, #DDE9D6, #BCD1B2); display: flex; align-items: flex-end; justify-content: center; overflow: hidden;">
        <svg width="46" height="46" viewBox="0 0 64 64" fill="none"><path d="M32 50V32" stroke="#4E7A46" stroke-width="3" stroke-linecap="round"/><circle cx="26" cy="31" r="6" fill="#6BA05C"/><circle cx="38" cy="30" r="5" fill="#57894B"/><path d="M24 50h16l-2 10H26z" fill="#8A6A48"/></svg>
      </div>
      <div style="font-size: 10.5px; color: #8C9088;">Jul</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; align-items: center;">
      <div style="width: 100%; height: 116px; border-radius: 13px; background: linear-gradient(165deg, #DDE9D6, #BCD1B2); display: flex; align-items: flex-end; justify-content: center; overflow: hidden;">
        <svg width="52" height="52" viewBox="0 0 64 64" fill="none"><path d="M32 50V24" stroke="#4E7A46" stroke-width="3.4" stroke-linecap="round"/><path d="M32 28c-8-3-12-8-12-15 7 0 12 5 12 15z" fill="#5F9455"/><path d="M32 34c8-3 11-9 11-15-7 0-11 6-11 15z" fill="#4E7A46"/><path d="M23 50h18l-2.5 10H25z" fill="#8A6A48"/></svg>
      </div>
      <div style="font-size: 10.5px; color: #8C9088;">Aug</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; align-items: center;">
      <div style="width: 100%; height: 136px; border-radius: 13px; background: linear-gradient(165deg, #D2E4CA, #A8C79E); border: 2px solid #14543A; display: flex; align-items: flex-end; justify-content: center; overflow: hidden;">
        <svg width="58" height="58" viewBox="0 0 64 64" fill="none"><path d="M32 50V18" stroke="#41663A" stroke-width="3.6" stroke-linecap="round"/><path d="M32 24c-10-3-15-10-15-18 9 0 15 6 15 18z" fill="#4E7A46"/><path d="M32 32c10-4 14-11 14-18-9 0-14 7-14 18z" fill="#3D5F37"/><path d="M23 50h18l-2.5 10H25z" fill="#7C5F40"/></svg>
      </div>
      <div style="font-size: 10.5px; color: #14543A; font-weight: 600;">Today</div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 16px 34px;">
    <div style="background: #FFFDF8; border: 1px solid #E6E0D3; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 12px;">
      <div style="width: 38px; height: 38px; border-radius: 11px; background: #EDF3E9; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2F6B45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.4 6 10a6 6 0 0 1-12 0c0-3.6 6-10 6-10z"/></svg>
      </div>
      <div style="flex-grow: 1;">
        <div style="font-size: 14.5px; font-weight: 600;">Next, water it</div>
        <div style="font-size: 12px; color: #6B6F68; margin-top: 1px;">Saturday, unless it rains</div>
      </div>
      <div class="disp" style="font-size: 15px; font-weight: 700; color: #2F6B45;">+40</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
