<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', system-ui, sans-serif; }
    a { color: #8FCBA6; } a:hover { color: #B4DEC3; }
    .disp { font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #14150F; color: #F6F3EC; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="padding: 52px 18px 14px; display: flex; align-items: center; gap: 14px;">
    <div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(246,243,236,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F6F3EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </div>
    <div>
      <div class="disp" style="font-size: 18px; font-weight: 700; letter-spacing: -0.01em;">Water your neem</div>
      <div style="font-size: 12px; color: #A8AA9E; margin-top: 1px;">Step 1 of 1</div>
    </div>
  </div>

  <div style="margin: 0 18px 14px; background: rgba(143,203,166,0.14); border: 1px solid rgba(143,203,166,0.3); border-radius: 16px; padding: 13px 15px; display: flex; gap: 11px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8FCBA6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><path d="M12 3s6 6.4 6 10a6 6 0 0 1-12 0c0-3.6 6-10 6-10z"/></svg>
    <div style="font-size: 13.5px; line-height: 1.45; color: #E8E9E0;">Photograph the plant <strong style="color: #FFFFFF;">while you pour</strong>. Keep the base of the plant and the wet soil both in frame.</div>
  </div>

  <div style="flex-grow: 1; margin: 0 18px; border-radius: 22px; overflow: hidden; position: relative; background: linear-gradient(170deg, #2C3826 0%, #1D2419 55%, #2A2418 100%);">

    <div style="position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center;">
      <svg width="260" height="300" viewBox="0 0 260 300" fill="none" style="opacity: 0.85;">
        <path d="M130 250V150" stroke="#527A45" stroke-width="7" stroke-linecap="round"/>
        <path d="M130 172c-34-10-52-34-52-62 28 0 52 20 52 62z" fill="#4C7342"/>
        <path d="M130 196c33-14 48-38 48-66-28 0-48 24-48 66z" fill="#3E6036"/>
        <path d="M78 250h104l-13 44H91z" fill="#6B5237"/>
        <path d="M84 258h92l-3 10H87z" fill="#3A2C1C" opacity="0.75"/>
      </svg>
    </div>

    <div style="position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; pointer-events: none;">
      <svg width="260" height="300" viewBox="0 0 260 300" fill="none" style="opacity: 0.5;">
        <path d="M126 250V148" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="6 5"/>
        <path d="M126 170c-34-10-52-34-52-62 28 0 52 20 52 62z" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="6 5" fill="none"/>
        <path d="M126 194c33-14 48-38 48-66-28 0-48 24-48 66z" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="6 5" fill="none"/>
        <path d="M74 250h104l-13 44H87z" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="6 5" fill="none"/>
      </svg>
    </div>

    <div style="position: absolute; left: 14px; top: 14px; display: flex; align-items: center; gap: 7px; background: rgba(20,21,15,0.66); border-radius: 999px; padding: 7px 12px;">
      <div style="width: 7px; height: 7px; border-radius: 999px; background: #8FCBA6;"></div>
      <span style="font-size: 11.5px; color: #E8E9E0;">Lined up with your first photo</span>
    </div>

    <div style="position: absolute; right: 14px; bottom: 14px; display: flex; align-items: center; gap: 6px; background: rgba(20,21,15,0.66); border-radius: 999px; padding: 7px 11px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8FCBA6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
      <span style="font-size: 11.5px; color: #E8E9E0;">At the plant</span>
    </div>

  </div>

  <div style="padding: 20px 18px 30px; display: flex; align-items: center; justify-content: space-between;">
    <div style="width: 52px; font-size: 12px; color: #A8AA9E;">Retake</div>
    <div style="width: 78px; height: 78px; border-radius: 999px; border: 3px solid rgba(246,243,236,0.9); display: flex; align-items: center; justify-content: center;">
      <div style="width: 62px; height: 62px; border-radius: 999px; background: #F6F3EC;"></div>
    </div>
    <div style="width: 52px; display: flex; justify-content: flex-end;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A8AA9E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
