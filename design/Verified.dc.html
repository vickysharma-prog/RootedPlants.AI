<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', system-ui, sans-serif; }
    a { color: #14543A; } a:hover { color: #0D3927; }
    .disp { font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F6F3EC; color: #1A1C19; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 60px 20px 0; display: flex; flex-direction: column; align-items: center; gap: 14px;">
    <div style="width: 74px; height: 74px; border-radius: 999px; background: #E4F1E6; display: flex; align-items: center; justify-content: center;">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#2F7D4F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.2 5.2L20 7"/></svg>
    </div>
    <div style="text-align: center;">
      <div class="disp" style="font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1;">Verified</div>
      <div style="font-size: 13.5px; color: #6B6F68; margin-top: 4px;">Neem, watered</div>
    </div>
  </div>

  <div style="margin: 22px 16px 0; background: #FFFDF8; border: 1px solid #E6E0D3; border-radius: 20px; padding: 6px 16px; display: flex; flex-direction: column;">

    <div style="display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid #EFEADF;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2F7D4F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M4 12.5l5.2 5.2L20 7"/></svg>
      <div style="width: 84px; font-size: 14px; font-weight: 600; flex-shrink: 0;">Location</div>
      <div style="font-size: 13px; color: #6B6F68; line-height: 1.35;">matches where you planted it</div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid #EFEADF;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2F7D4F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M4 12.5l5.2 5.2L20 7"/></svg>
      <div style="width: 84px; font-size: 14px; font-weight: 600; flex-shrink: 0;">Time</div>
      <div style="font-size: 13px; color: #6B6F68; line-height: 1.35;">just now</div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid #EFEADF;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2F7D4F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M4 12.5l5.2 5.2L20 7"/></svg>
      <div style="width: 84px; font-size: 14px; font-weight: 600; flex-shrink: 0;">Same plant</div>
      <div style="font-size: 13px; color: #6B6F68; line-height: 1.35;">lines up with your first photo</div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 13px 0;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2F7D4F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M4 12.5l5.2 5.2L20 7"/></svg>
      <div style="width: 84px; font-size: 14px; font-weight: 600; flex-shrink: 0;">Watering</div>
      <div style="font-size: 13px; color: #6B6F68; line-height: 1.35;">soil is wet, water in frame</div>
    </div>

  </div>

  <div style="margin: 16px 16px 0; background: linear-gradient(165deg, #14543A, #0E3D2A); border-radius: 22px; padding: 22px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px;">
    <div>
      <div class="disp" style="font-size: 44px; font-weight: 800; color: #FFFDF8; letter-spacing: -0.03em; line-height: 1;">+40</div>
      <div style="font-size: 13px; color: #A9C9B7; margin-top: 5px;">points added</div>
    </div>
    <div style="text-align: right;">
      <div style="display: flex; align-items: center; justify-content: flex-end; gap: 6px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8FCBA6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c0 4-4 5-4 9a4 4 0 0 0 8 0c0-1.6-.7-2.7-1.5-3.7"/></svg>
        <span class="disp" style="font-size: 20px; font-weight: 700; color: #FFFDF8;">13 days</span>
      </div>
      <div style="font-size: 12.5px; color: #A9C9B7; margin-top: 4px;">streak, x1.4 from here</div>
    </div>
  </div>

  <div style="margin: 14px 16px 0; background: #EFEADF; border-radius: 16px; padding: 13px 15px; display: flex; gap: 11px; align-items: flex-start;">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7A5C3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8.5h.01"/></svg>
    <div style="font-size: 12.5px; color: #5C5F58; line-height: 1.45;">Next watering moves to Saturday. Rain is forecast on Thursday.</div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 16px 34px; display: flex; flex-direction: column; gap: 10px;">
    <div style="background: #14543A; color: #FFFDF8; border-radius: 15px; height: 52px; display: flex; align-items: center; justify-content: center; font-size: 15.5px; font-weight: 600;">Back to today</div>
    <div style="height: 46px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; color: #14543A;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#14543A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V3M8 7l4-4 4 4"/></svg>
      Share this one
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
