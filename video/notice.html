<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The notification on its own</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/*
 * One notification, on nothing, at a size worth warping.
 *
 * It gets laid onto a real phone in a real photograph by phoneshot.py, so it
 * is drawn on a transparent page at four times the size it appears on a
 * screen. The words are exactly what web/lib/notify.ts composes for a neem
 * that is one day late.
 *
 * Rendered at 1400 by 600, transparent.
 */
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1400px;
  height: 600px;
  background: transparent;
  font-family: -apple-system, "SF Pro Text", "Instrument Sans", system-ui, sans-serif;
  color: #fff;
  -webkit-font-smoothing: antialiased;
}

.banner {
  width: 1400px;
  height: 600px;
  border-radius: 118px;
  padding: 0 86px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  /* It sits on a lit screen in the shot, so it carries its own light rather
     than relying on a blur that a warp cannot reproduce. */
  background: rgba(58, 63, 74, 0.93);
  border: 4px solid rgba(255, 255, 255, 0.16);
}

.head {
  display: flex;
  align-items: center;
  gap: 30px;
  font-size: 58px;
  font-weight: 500;
  opacity: 0.88;
}
.mark {
  width: 104px; height: 104px;
  border-radius: 28px;
  background: linear-gradient(160deg, #9ec9ad, #6f9e7e);
  display: grid; place-items: center;
  flex: none;
}
.when { margin-left: auto; font-size: 54px; opacity: 0.68; }

h3 { margin-top: 44px; font-size: 92px; font-weight: 600; line-height: 1.2; }
p { margin-top: 26px; font-size: 68px; line-height: 1.34; opacity: 0.92; }
</style>
</head>
<body>

<div class="banner">
  <div class="head">
    <span class="mark">
      <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#0a0f0b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20V9"/><path d="M12 12C7 12 5 9 5 5c4 0 7 3 7 7z"/><path d="M12 14c5-1 7-4 7-8-4 0-7 3-7 8z"/>
      </svg>
    </span>
    <span>Rooted</span>
    <span class="when">now</span>
  </div>
  <h3>&#128167; Neem is thirsty</h3>
  <p>Vicky, your neem is asking for water.</p>
</div>

</body>
</html>
